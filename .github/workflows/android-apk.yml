name: APK Android

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/app_test.dart test/debts_focus_test.dart

      # Clé de signature stable (facultatif mais recommandé : permet de mettre
      # l'app à jour sans la désinstaller). Secrets : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=boutique\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          else
            echo "::warning::Pas de clé de signature configurée : APK signé avec une clé de debug."
          fi

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - run: mv build/app/outputs/flutter-apk/app-release.apk build/compte-boutique.apk

      - uses: actions/upload-artifact@v4
        with:
          name: compte-boutique-apk
          path: app/build/compte-boutique.apk

      # Publie l'APK dans une « Release » GitHub : téléchargeable directement depuis le téléphone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Compte Boutique (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: app/build/compte-boutique.apk
          body: |
            Installer sur Android : téléchargez `compte-boutique.apk`, ouvrez-le et autorisez l'installation.
            Commit : ${{ github.sha }}
